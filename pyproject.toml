[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-live"
version = "0.3.2"
requires-python = ">=3.11,<3.12"

[project.scripts]
yumeno = "agents.runtime.cli:main"

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "persona*", "ingestion*", "rag*", "agents*", "realtime*", "voice*", "live*", "desktop*", "integrations*", "extensions*", "structured_data*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"ingestion.local_embedding" = ["requirements-local.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external infrastructure and credentials"]
