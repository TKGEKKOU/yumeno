<section id="providers-view" class="view is-hidden">
  <div class="providers-container">
    <!-- 顶部分类导航 -->
    <nav class="providers-tabs">
      <button class="providers-tab active" data-category="llm">LLM</button>
      <button class="providers-tab" data-category="embedding">嵌入 (Embedding)</button>
      <button class="providers-tab" data-category="reranker">重排序 (Reranker)</button>
      <button class="providers-tab" data-category="stt">语音转文字 (STT)</button>
      <button class="providers-tab" data-category="tts">文字转语音 (TTS)</button>
      <button class="providers-tab" data-category="web_search">联网搜索</button>
    </nav>

    <!-- 加载状态 -->
    <div id="providers-loading" class="providers-loading">
      <i data-lucide="loader-circle" class="spin"></i>
      <p>加载中...</p>
    </div>

    <!-- 错误状态 -->
    <div id="providers-error" class="providers-error is-hidden">
      <i data-lucide="alert-circle"></i>
      <p class="error-message"></p>
      <button class="button button-primary" onclick="loadProviders()">重试</button>
    </div>

    <!-- 提供商卡片网格 -->
    <div id="providers-grid" class="providers-grid"></div>
  </div>

  <!-- 配置弹窗模板 -->
  <template id="provider-config-modal-template">
    <div class="modal-overlay" data-provider-modal>
      <div class="modal-content provider-config-modal">
        <div class="modal-header">
          <h3 class="modal-title"></h3>
          <button class="modal-close" type="button" aria-label="关闭">×</button>
        </div>

        <form class="provider-config-form">
          <div class="config-form-body">
            <p class="provider-description"></p>

            <div class="form-fields">
              <label class="field">
                <span>API Key <span class="required">*</span></span>
                <div class="secret-input">
                  <input type="password" name="api_key" autocomplete="off" placeholder="请输入 API Key" />
                  <button type="button" class="toggle-visibility" title="显示/隐藏">
                    <i data-lucide="eye"></i>
                  </button>
                </div>
              </label>

              <label class="field">
                <span>Base URL</span>
                <input type="url" name="base_url" placeholder="留空使用默认地址" />
              </label>

              <label class="field">
                <span>模型名称</span>
                <input type="text" name="model" placeholder="留空使用默认模型" />
              </label>
            </div>

            <div class="form-actions">
              <button type="button" class="button button-secondary test-connection">
                <i data-lucide="wifi"></i> 测试连接
              </button>
              <div class="form-actions-right">
                <button type="button" class="button button-secondary" onclick="this.closest('[data-provider-modal]').remove()">取消</button>
                <button type="submit" class="button button-primary">保存配置</button>
              </div>
            </div>

            <div class="test-result is-hidden"></div>
          </div>
        </form>
      </div>
    </div>
  </template>
</section>
