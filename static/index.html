  <div class="app-shell">

      <nav class="primary-nav" aria-label="主导航">

        <button id="nav-integrations" class="nav-item" type="button" data-view="integrations" title="QQ、NapCat 和 B站直播"><i data-lucide="radio-tower"></i><span class="nav-label">接入</span></button>

      <div class="sidebar-footer">

        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="固定展开侧边栏" aria-pressed="false" title="固定展开侧边栏"><i class="sidebar-collapse-icon" data-lucide="panel-left-close"></i><i class="sidebar-expand-icon" data-lucide="panel-left-open"></i></button>
      </div>
    </div>
  </aside>

  <main id="app-main" class="page-shell" tabindex="-1">
    <div id="setup-cue" class="setup-cue" hidden>
      <p>尚未配置大模型。请到「系统 → 服务供应商」粘贴 API Key，即可开始对话。</p>

        <button class="button button-warning" type="button" data-view="system">去配置</button>
        <button id="setup-cue-dismiss" class="button button-secondary" type="button">稍后</button>
      </div>
    </div>
    <div id="view-root"></div>
  </main>
  </div>

  <dialog id="settings-confirm-dialog" class="settings-confirm-dialog" aria-labelledby="settings-confirm-title"><form method="dialog"><h2 id="settings-confirm-title">保存前确认</h2><p id="settings-confirm-detail" class="settings-confirm-detail"></p><div class="settings-confirm-actions"><button id="settings-confirm-cancel" class="button button-secondary" type="button">取消</button><button id="settings-confirm-submit" class="button button-primary" type="button">确认保存</button></div></form></dialog>

  <dialog id="save-all-dialog" class="settings-confirm-dialog" aria-labelledby="save-all-title"><h2 id="save-all-title">保存全部修改</h2><p id="save-all-detail" class="settings-confirm-detail"></p><p id="save-all-error" class="inline-error" role="alert"></p><div class="settings-confirm-actions"><button id="save-all-cancel" class="button button-secondary" type="button">取消</button><button id="save-all-confirm" class="button button-primary" type="button">确认保存</button></div></dialog>
