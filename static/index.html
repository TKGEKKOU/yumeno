  <script src="/static/js/voice-studio.js" defer></script>

<body>
  <a class="skip-link" href="#view-root">跳到主要内容</a>
  <div class="app-shell">
  <aside class="site-sidebar">
    <div class="sidebar-inner">
      <nav class="primary-nav" aria-label="主导航">
        <button id="nav-chat" class="nav-item" type="button" data-view="chat" title="对话"><i data-lucide="message-circle"></i><span class="nav-label">对话</span></button>
        <button id="nav-create" class="nav-item" type="button" data-view="create" title="创建角色"><i data-lucide="user-plus"></i><span class="nav-label">创建角色</span></button>
        <button id="nav-manage" class="nav-item" type="button" data-view="manage" title="管理角色、资料与能力"><i data-lucide="library"></i><span class="nav-label">管理</span></button>
        <button id="nav-voice" class="nav-item" type="button" data-view="voice" title="声音"><i data-lucide="mic-vocal"></i><span class="nav-label">声音</span></button>
        <button id="nav-rvc" class="nav-item" type="button" data-view="rvc" title="RVC 音频生产"><i data-lucide="audio-lines"></i><span class="nav-label">RVC</span></button>
        <button id="nav-integrations" class="nav-item" type="button" data-view="integrations" title="B站直播"><i data-lucide="radio-tower"></i><span class="nav-label">B站直播</span></button>
        <button id="nav-napcat" class="nav-item" type="button" data-view="napcat" title="QQ 接入"><i data-lucide="message-square-more"></i><span class="nav-label">QQ 接入</span></button>
                <button id="nav-providers" class="nav-item" type="button" data-view="providers" title="提供商配置"><i data-lucide="layers"></i><span class="nav-label">提供商配置</span></button>
<button id="nav-plugins" class="nav-item" type="button" data-view="plugins" title="Skill、MCP 与 Tool 能力扩展"><i data-lucide="puzzle"></i><span class="nav-label">能力扩展</span></button>
        <button id="nav-test" class="nav-item" type="button" data-view="test" title="RAG 评测"><i data-lucide="flask-conical"></i><span class="nav-label">RAG 评测</span></button>
        <button id="nav-settings" class="nav-item" type="button" data-view="settings" title="系统设置"><i data-lucide="settings-2"></i><span class="nav-label">系统设置</span></button>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="sidebar-toggle" type="button" aria-pressed="false" title="切换主题" aria-label="切换主题"><i class="theme-icon-sun" data-lucide="sun"></i><i class="theme-icon-moon" data-lucide="moon"></i></button>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="固定展开侧边栏" aria-pressed="false" title="固定展开侧边栏"><i class="sidebar-collapse-icon" data-lucide="panel-left-close"></i><i class="sidebar-expand-icon" data-lucide="panel-left-open"></i></button>
      </div>
    </div>
  </aside>

  <main id="app-main" class="page-shell" tabindex="-1">
    <div id="setup-cue" class="setup-cue" hidden>
      <p>尚未配置大模型。请到「提供商配置」粘贴 API Key，即可开始对话。</p>
      <div class="setup-cue-actions">
        <button class="button button-warning" type="button" data-view="providers">去配置</button>
        <button id="setup-cue-dismiss" class="button button-secondary" type="button">稍后</button>
      </div>
    </div>
    <div id="view-root"></div>
  </main>
  </div>

  <div id="preview-backdrop" class="backdrop"></div><aside id="preview-drawer" class="preview-drawer" aria-hidden="true"><header class="drawer-header"><strong id="preview-title">资料预览</strong><button id="close-preview" class="close-button" type="button"><i data-lucide="x"></i></button></header><pre id="preview-content" class="selectable"></pre></aside>
  <dialog id="settings-confirm-dialog" class="settings-confirm-dialog" aria-labelledby="settings-confirm-title"><form method="dialog"><h2 id="settings-confirm-title">保存前确认</h2><p id="settings-confirm-detail" class="settings-confirm-detail"></p><div class="settings-confirm-actions"><button id="settings-confirm-cancel" class="button button-secondary" type="button">取消</button><button id="settings-confirm-submit" class="button button-primary" type="button">确认保存</button></div></form></dialog>
  <dialog id="delete-persona-dialog" class="settings-confirm-dialog" aria-labelledby="delete-persona-title"><form method="dialog"><h2 id="delete-persona-title">永久删除角色</h2><p id="delete-persona-detail" class="settings-confirm-detail">角色及其所有数据将永久删除，无法恢复。</p><p id="delete-persona-error" class="inline-error" role="alert"></p><div class="settings-confirm-actions"><button id="delete-persona-cancel" class="button button-secondary" type="button">取消</button><button id="delete-persona-confirm" class="button button-danger" type="button">永久删除</button></div></form></dialog>
  <dialog id="save-all-dialog" class="settings-confirm-dialog" aria-labelledby="save-all-title"><h2 id="save-all-title">保存全部修改</h2><p id="save-all-detail" class="settings-confirm-detail"></p><p id="save-all-error" class="inline-error" role="alert"></p><div class="settings-confirm-actions"><button id="save-all-cancel" class="button button-secondary" type="button">取消</button><button id="save-all-confirm" class="button button-primary" type="button">确认保存</button></div></dialog>
</body>
</html>
